name: Docker CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install browser check dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/browser"
          "$RUNNER_TEMP/browser/bin/pip" install playwright==1.64.1
          "$RUNNER_TEMP/browser/bin/playwright" install --with-deps chromium
          echo "CI_PYTHON=$RUNNER_TEMP/browser/bin/python" >> "$GITHUB_ENV"
      - name: Build and check Docker deployment
        env:
          CI_ARTIFACTS_DIR: ${{ runner.temp }}/docker-check-logs
          CI_TESTED_IMAGE: bioautoml-fast:tested
        run: bash .github/ci.sh
      - name: Publish tested image to GHCR
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          export DOCKER_CONFIG="$RUNNER_TEMP/ghcr-auth"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag bioautoml-fast:tested "$image:sha-$GITHUB_SHA"
          docker tag bioautoml-fast:tested "$image:latest"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-check-logs
          path: ${{ runner.temp }}/docker-check-logs
          retention-days: 7
