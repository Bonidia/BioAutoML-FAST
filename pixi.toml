# Pixi locks the native tooling; uv.lock remains the sole Python-package lock.
# Python is installed by uv from .python-version into an isolated environment.
[workspace]
name = "bioautoml-fast"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
requires-pixi = "==0.81.0"

[dependencies]
uv = "==0.7.3"
redis-server = "==7.2.11"
mmseqs2 = "==15.6f452"

[activation.env]
UV_PROJECT_ENVIRONMENT = ".venv-repro"
UV_PYTHON_PREFERENCE = "only-managed"
UV_LINK_MODE = "copy"

[tasks]
sync = "uv sync --locked --no-dev"
check-lock = "uv lock --check"
environment = "uv run --locked --no-dev python -m bioautoml.environment_report"
web = "uv run --locked --no-dev bash start.sh"
ablation = "uv run --locked --no-dev python manuscript/experiments/run_ablation.py"
benchmark-first = "uv run --locked --no-dev python manuscript/experiments/run_benchmarks.py --runs 1"
benchmark = "uv run --locked --no-dev python manuscript/experiments/run_benchmarks.py"
learner-aware = "uv run --locked --no-dev python manuscript/experiments/run_learner_aware.py"
budget-sweep = "uv run --locked --no-dev python manuscript/experiments/run_trial_budget_sweep.py"
homology = "uv run --locked --no-dev python manuscript/experiments/run_homology.py"
sequence-overlap = "uv run --locked --no-dev python manuscript/experiments/audit_sequence_overlap.py"
pruning = "uv run --locked --no-dev python manuscript/experiments/run_pruning.py"
benchmark-pruning-off = "uv run --locked --no-dev python manuscript/experiments/run_benchmarks.py --no-pruning --runs 1 --output manuscript/experiments/results/benchmark_pruning_off"
